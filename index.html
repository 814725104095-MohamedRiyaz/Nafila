<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cricket Scoreboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🏏 Cricket Scoreboard</h1>

<div class="scoreBox">
<h2 id="score">0/0</h2>
<p id="overs">Overs : 0.0</p>
</div>

<table>
<tr>
<th>Player</th>
<th>Runs</th>
<th>Balls</th>
</tr>

<tbody id="players"></tbody>

</table>

<h3>Add Score</h3>

<div class="buttons">

<button onclick="addRun(0)">0</button>
<button onclick="addRun(1)">1</button>
<button onclick="addRun(2)">2</button>
<button onclick="addRun(3)">3</button>
<button onclick="addRun(4)">4</button>
<button onclick="addRun(6)">6</button>

</div>

<div class="buttons">

<button onclick="wide()">Wide</button>
<button onclick="noBall()">No Ball</button>
<button onclick="wicket()">Wicket</button>
<button onclick="undo()">Undo</button>

</div>

<h3>Ball History (Linked List)</h3>

<ul id="history"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
